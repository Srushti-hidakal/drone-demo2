services:
  drone:
    image: drone/drone:2
    ports:
      - "80:80"
    volumes:
      - drone-data:/data
    restart: always
    environment:
      - DRONE_GITHUB_CLIENT_ID=Ov23li7SdI7JRHIF1tLq
      - DRONE_GITHUB_CLIENT_SECRET=65e777e07087d1938a1ac4032b50afb03f467d6e
      - DRONE_RPC_SECRET=supersecret
      - DRONE_SERVER_HOST=kathy-chromic-supereloquently.ngrok-free.dev
      - DRONE_SERVER_PROTO=https

  runner:
    image: drone/drone-runner-docker:1
    ports:
      - "3001:3000"
    restart: always
    depends_on:
      - drone
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone
      - DRONE_RPC_SECRET=supersecret
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=my-runner

volumes:
  drone-data: