kind: pipeline
type: docker
name: default

steps:
  - name: test
    image: node:18
    commands:
      - node app.js

  - name: build
    image: docker:24-cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t drone-demo .

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock